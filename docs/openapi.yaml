openapi: 3.1.0
info:
  title: Aster API
  version: 1.0.0
  description: Task management API for Users and Managers

servers:
  - url: http://localhost:3000/api

tags:
  - name: Auth
  - name: Users
  - name: Tasks
  - name: Categories
  - name: Tags

paths:

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201": { description: User registered successfully }
        "400": { description: Missing fields or invalid data }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: Login successful }
        "401": { description: Invalid credentials }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        "200": { description: User profile returned }
        "401": { description: Unauthorized }

  /users:
    get:
      tags: [Users]
      summary: List all users (manager only in backend)
      responses:
        "200": { description: List of users }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: User returned }
        "404": { description: User not found }

    put:
      tags: [Users]
      summary: Update user (self-only in backend)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string }
      responses:
        "200": { description: User updated }

    delete:
      tags: [Users]
      summary: Delete user (self or manager in backend)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: User deleted }

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Update user role (manager only in backend)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, manager]
      responses:
        "200": { description: Role updated }

  /tasks:
    get:
      tags: [Tasks]
      summary: Get tasks (backend enforces role rules)
      responses:
        "200": { description: List of tasks }

    post:
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string }
                priority: { type: string }
                dueDate: { type: string }
                categoryId: { type: integer }
      responses:
        "201": { description: Task created }

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Task returned }
        "404": { description: Not found }

    put:
      tags: [Tasks]
      summary: Update task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Task updated }

    delete:
      tags: [Tasks]
      summary: Delete task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Task deleted }

  /tasks/user/{userId}/tasks:
    get:
      tags: [Tasks]
      summary: Get tasks by user ID (manager only in backend)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Task list }

  /categories:
    get:
      tags: [Categories]
      summary: Get categories
      responses:
        "200": { description: List returned }

    post:
      tags: [Categories]
      summary: Create category
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string }
                color: { type: string }
      responses:
        "201": { description: Created }

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Category returned }
        "404": { description: Not found }

    put:
      tags: [Categories]
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Updated }

    delete:
      tags: [Categories]
      summary: Delete category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /tags:
    get:
      tags: [Tags]
      summary: Get all tags
      responses:
        "200": { description: List returned }

    post:
      tags: [Tags]
      summary: Create tag
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201": { description: Created }

  /tags/{id}:
    get:
      tags: [Tags]
      summary: Get tag
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Tag returned }
        "404": { description: Not found }

    put:
      tags: [Tags]
      summary: Update tag
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Updated }

    delete:
      tags: [Tags]
      summary: Delete tag
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }












